name: Validate HR Assist
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check hr_assist/web/app.js
      - run: node --test tests/test_page_navigation.js tests/test_model_settings.js tests/test_candidate_query.js tests/test_candidate_list.js tests/test_diagnostic_reasons.js tests/test_semantic_assessment_ui.js tests/test_semantic_source_ui.js tests/test_decision_explanations_ui.js
      - run: docker build -t hr-assist:ci .
      - name: Container authentication, OCR and persistence smoke test
        run: python scripts/container_smoke.py
