services:
  hr-assist:
    build:
      context: .
    image: hr-assist:0.1.0
    platform: linux/amd64
    container_name: hr-assist
    restart: unless-stopped
    init: true
    user: "${HR_UID:-10001}:${HR_GID:-10001}"
    ports:
      - "127.0.0.1:${HR_PORT:-8088}:8000"
    environment:
      HR_STATE_DIR: /state
      HR_DATA_DIR: /data
      HR_PUBLIC_URL: ${HR_PUBLIC_URL:?请在.env中填写实际HTTPS工作台域名}
      HR_ADMIN_USERNAME: ${HR_ADMIN_USERNAME:-admin}
      HR_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      HR_SECURE_COOKIE: "true"
      HR_SCHEDULER: "true"
      TZ: Asia/Shanghai
    volumes:
      - ${HR_STORAGE_ROOT:-./storage}/state:/state
      - ${HR_STORAGE_ROOT:-./storage}/data:/data
      - ./secrets/admin_password.txt:/run/secrets/admin_password:ro
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 96
    mem_limit: 2g
    # Some NAS kernels lack CFS CPU quotas. Leave CPU time uncapped by default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
